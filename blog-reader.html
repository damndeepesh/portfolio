<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Reader - Deepesh Gupta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="blog-list.js"></script>
    <style>
        /* Blog-specific styles */
        .blog-container {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--spacing-3xl) var(--spacing-lg);
        }

        .blog-header {
            text-align: center;
            margin-bottom: var(--spacing-3xl);
            padding-bottom: var(--spacing-xl);
            border-bottom: 1px solid var(--border-color);
        }

        .blog-title {
            font-family: var(--font-body);
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
            line-height: 1.2;
        }

        .blog-meta {
            display: flex;
            justify-content: center;
            gap: var(--spacing-lg);
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .blog-meta span {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .blog-content {
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .blog-content h1,
        .blog-content h2,
        .blog-content h3,
        .blog-content h4 {
            color: var(--text-primary);
            margin-top: var(--spacing-2xl);
            margin-bottom: var(--spacing-lg);
            font-weight: 600;
        }

        .blog-content h1 {
            font-size: 2.5rem;
            font-family: var(--font-display);
        }

        .blog-content h2 {
            font-size: 2rem;
        }

        .blog-content h3 {
            font-size: 1.5rem;
        }

        .blog-content p {
            margin-bottom: var(--spacing-lg);
        }

        .blog-content ul,
        .blog-content ol {
            margin-bottom: var(--spacing-lg);
            padding-left: var(--spacing-xl);
        }

        .blog-content li {
            margin-bottom: var(--spacing-sm);
        }

        .blog-content blockquote {
            background: var(--bg-secondary);
            border-left: 4px solid var(--primary-color);
            padding: var(--spacing-lg);
            margin: var(--spacing-xl) 0;
            border-radius: var(--radius-md);
            font-style: italic;
            color: var(--text-secondary);
        }

        [data-theme="dark"] .blog-content blockquote {
            background: #1e293b;
            color: #cbd5e1;
            border-left-color: #3b82f6;
        }

        .blog-content code {
            background: var(--bg-tertiary);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
        }

        [data-theme="dark"] .blog-content code {
            background: #1e293b;
            color: #60a5fa;
            border-color: #334155;
        }

        .blog-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            overflow-x: auto;
            margin: var(--spacing-xl) 0;
            border: 1px solid var(--border-color);
        }

        [data-theme="dark"] .blog-content pre {
            background: #0f172a;
            color: #e2e8f0;
            border-color: #334155;
        }

        .blog-content pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .blog-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin: var(--spacing-2xl) 0;
            padding-top: var(--spacing-xl);
            border-top: 1px solid var(--border-color);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: var(--spacing-xl);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            transform: translateX(-4px);
        }

        .loading {
            text-align: center;
            padding: var(--spacing-3xl);
            color: var(--text-secondary);
        }

        .error {
            text-align: center;
            padding: var(--spacing-3xl);
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: var(--radius-md);
            margin: var(--spacing-xl) 0;
        }

        .blog-list {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--spacing-3xl) var(--spacing-lg);
        }

        .blog-list-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .blog-list-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .blog-list-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .blog-list-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: var(--spacing-md);
        }

        .blog-list-excerpt {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .blog-title {
                font-size: 2rem;
            }

            .blog-meta {
                flex-direction: column;
                gap: var(--spacing-sm);
            }

            .blog-content {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button id="theme-toggle" class="theme-btn">
            <i class="fas fa-sun" id="theme-icon"></i>
        </button>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2 class="logo-text"><a href="index.html" style="text-decoration: none; color: inherit;">Deepesh Gupta</a></h2>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#blog">Blog</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Blog Content -->
    <main id="main-content">
        <!-- Content will be loaded here -->
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; <span id="current-year">2025</span> Deepesh Gupta. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        class BlogReader {
            constructor() {
                this.blogs = [];
                this.init();
            }

            init() {
                try {
                    // Load blogs from auto-generated list
                    this.loadBlogs();
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const blogId = urlParams.get('blog');

                    if (blogId) {
                        this.loadBlog(blogId);
                    } else {
                        this.showBlogList();
                    }
                } catch (error) {
                    console.error('Error initializing blog reader:', error);
                    this.showError('Failed to load blogs. Please try again later.');
                }
            }

            loadBlogs() {
                try {
                    // Use the auto-generated blog list
                    if (window.BLOG_LIST && Array.isArray(window.BLOG_LIST)) {
                        this.blogs = window.BLOG_LIST;
                        console.log(`✅ Loaded ${this.blogs.length} blogs from auto-generated list!`);
                    } else {
                        console.warn('⚠️  Auto-generated blog list not found, using fallback');
                        // Fallback to manual list for local development
                        this.blogs = [
                            {
                                id: 'rag-pipelines-future-search',
                                title: 'The Future of Search: RAG Pipelines and Knowledge Retrieval',
                                date: 'October 1, 2025',
                                readTime: '5 min read',
                                excerpt: 'Exploring how Retrieval-Augmented Generation is revolutionizing information retrieval...',
                                path: 'blogs/2025/10/rag-pipelines-future-search.md'
                            },
                            {
                                id: 'dm',
                                title: 'The test for the blog if it really works or is this shit',
                                date: 'October 1, 2025',
                                readTime: '1 min read',
                                excerpt: 'A test blog post to check if the blog system is working properly...',
                                path: 'blogs/2025/10/dm.md'
                            }
                        ];
                    }
                } catch (error) {
                    console.error('Error loading blogs:', error);
                    this.showError('Failed to load blogs. Please try again later.');
                }
            }

            async loadBlog(blogId) {
                const blog = this.blogs.find(b => b.id === blogId);
                if (!blog) {
                    this.showError('Blog post not found');
                    return;
                }

                this.showLoading();

                try {
                    const response = await fetch(blog.path);
                    if (!response.ok) {
                        throw new Error('Failed to load blog post');
                    }
                    const markdown = await response.text();
                    this.renderBlog(blog, markdown);
                } catch (error) {
                    console.error('Error loading blog:', error);
                    this.showError('Failed to load blog post. Please try again later.');
                }
            }

            renderBlog(blog, markdown) {
                // Handle different versions of marked library
                let html;
                if (typeof marked.parse === 'function') {
                    html = marked.parse(markdown);
                } else if (typeof marked === 'function') {
                    html = marked(markdown);
                } else {
                    console.error('Marked library not properly loaded');
                    this.showError('Markdown parser not available');
                    return;
                }
                const mainContent = document.getElementById('main-content');

                // Check if markdown already contains metadata (Published:, Author:, etc.)
                const hasMetadata = markdown.includes('**Published:**') || 
                                  markdown.includes('**Author:**') || 
                                  markdown.includes('**Reading Time:**');

                // Extract tags from markdown (look for **Tags:** line)
                const tagMatch = markdown.match(/\*\*Tags:\*\*\s*(.+)/);
                const tags = tagMatch ? tagMatch[1].split(',').map(tag => tag.trim()) : [];

                // If markdown has metadata, don't show duplicate header
                if (hasMetadata) {
                    mainContent.innerHTML = `
                        <div class="blog-container">
                            <a href="blog-reader.html" class="back-link">
                                <i class="fas fa-arrow-left"></i>
                                <span>Back to Blog</span>
                            </a>

                            <article class="blog-post">
                                <div class="blog-content">
                                    ${html}
                                </div>
                            </article>
                        </div>
                    `;
                } else {
                    // Show header only if markdown doesn't have metadata
                    mainContent.innerHTML = `
                        <div class="blog-container">
                            <a href="blog-reader.html" class="back-link">
                                <i class="fas fa-arrow-left"></i>
                                <span>Back to Blog</span>
                            </a>

                            <article class="blog-post">
                                <header class="blog-header">
                                    <h1 class="blog-title">${blog.title}</h1>
                                    <div class="blog-meta">
                                        <span>
                                            <i class="fas fa-calendar"></i>
                                            ${blog.date}
                                        </span>
                                        <span>
                                            <i class="fas fa-clock"></i>
                                            ${blog.readTime}
                                        </span>
                                        <span>
                                            <i class="fas fa-user"></i>
                                            Deepesh Gupta
                                        </span>
                                    </div>
                                </header>

                                <div class="blog-content">
                                    ${html}
                                </div>

                                ${tags.length > 0 ? `
                                    <div class="blog-tags">
                                        ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                    </div>
                                ` : ''}
                            </article>
                        </div>
                    `;
                }

                // Update page title
                document.title = `${blog.title} - Deepesh Gupta`;
            }

            showBlogList() {
                const mainContent = document.getElementById('main-content');
                
                mainContent.innerHTML = `
                    <div class="blog-list">
                        <div class="section-header">
                            <h1 class="section-title">Blog Posts</h1>
                            <p class="section-subtitle">Thoughts on AI, Machine Learning, and Technology</p>
                        </div>
                        
                        ${this.blogs.map(blog => `
                            <div class="blog-list-item" onclick="window.location.href='?blog=${blog.id}'">
                                <h2 class="blog-list-title">${blog.title}</h2>
                                <div class="blog-list-meta">
                                    <i class="fas fa-calendar"></i> ${blog.date} • 
                                    <i class="fas fa-clock"></i> ${blog.readTime}
                                </div>
                                <p class="blog-list-excerpt">${blog.excerpt}</p>
                            </div>
                        `).join('')}
                    </div>
                `;

                document.title = 'Blog Posts - Deepesh Gupta';
            }

            showLoading() {
                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                        <p>Loading blog post...</p>
                    </div>
                `;
            }

            showError(message) {
                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = `
                    <div class="blog-container">
                        <a href="blog-reader.html" class="back-link">
                            <i class="fas fa-arrow-left"></i>
                            <span>Back to Blog</span>
                        </a>
                        <div class="error">
                            <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                            <p>${message}</p>
                        </div>
                    </div>
                `;
            }
        }

        // Utility function to update copyright year
        function updateCopyrightYear() {
            const currentYear = new Date().getFullYear();
            const yearElement = document.getElementById('current-year');
            if (yearElement) {
                yearElement.textContent = currentYear;
            }
        }

        // Initialize blog reader when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            // Update copyright year
            updateCopyrightYear();
            
            // Initialize blog reader
            new BlogReader();
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
