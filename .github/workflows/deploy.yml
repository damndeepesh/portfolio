name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Auto-generate blog list
        run: |
          echo "🔍 Auto-discovering blog posts..."
          node generate-blog-list.js
          echo "📄 Generated blog-list.js successfully!"
          
      - name: Verify generated files
        run: |
          echo "📋 Generated files:"
          ls -la blog-list.js
          echo "📊 Blog posts found:"
          node -e "require('./blog-list.js'); console.log('Total blogs:', window.BLOG_LIST.length);"
          
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: .
          
      - name: Deployment Summary
        run: |
          echo "🎉 Deployment completed!"
          echo "✨ Your portfolio is now live with all blog posts!"
